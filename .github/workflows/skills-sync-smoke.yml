name: (temp) skills-sync smoke test

# TEMPORARY — proves the skills-sync auth + logic works in CI on this PR branch, then gets removed
# before merge. workflow_dispatch/schedule only run from the default branch, so this uses a push
# trigger scoped to the PR branch. It runs the sync in --dry-run (NO commit/tag/release) and only
# needs read access, so it exercises the SKILLS_REPO_TOKEN clone path without mutating anything.

on:
  push:
    branches: [feat/claude-plugin-skills-and-sync]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure skills-repo read access
        env:
          SKILLS_REPO_TOKEN: ${{ secrets.SKILLS_REPO_TOKEN }}
        run: |
          if [ -z "${SKILLS_REPO_TOKEN}" ]; then
            echo "::error::SKILLS_REPO_TOKEN secret is not set."
            exit 1
          fi
          git config --global "url.https://x-access-token:${SKILLS_REPO_TOKEN}@github.com/pandadoc-studio/agentic-hub-skills.insteadOf" "https://github.com/pandadoc-studio/agentic-hub-skills"

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Sync (dry run — no writes)
        run: node scripts/sync-skills.mjs --dry-run

      - name: Validate plugin
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict
