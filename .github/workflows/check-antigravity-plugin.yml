name: Check Antigravity plugin

# antigravity/skills is a copy of ./skills (see scripts/build-antigravity-plugin.mjs). Fails a PR
# that changes one without the other, or that breaks the Antigravity manifest schema.

on:
  pull_request:
    paths:
      - "skills/**"
      - "antigravity/**"
      - "scripts/build-antigravity-plugin.mjs"
      - "scripts/lib/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - run: node scripts/build-antigravity-plugin.mjs --check
