name: Publish PandaDoc skill to ClawHub

on:
  workflow_dispatch:
    inputs:
      owner:
        description: ClawHub publisher handle with access to publish this skill
        required: true
        type: string
      version:
        description: Skill release version
        required: true
        default: "1.0.0"
        type: string
      dry_run:
        description: Preview only; do not publish
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-clawhub
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Publish or preview, then inspect a published release
        env:
          OWNER: ${{ inputs.owner }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_CONFIG_PATH: ${{ runner.temp }}/clawhub-config.json
          CLAWHUB_DISABLE_TELEMETRY: "1"
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          preview = os.environ["DRY_RUN"] == "true"
          owner = os.environ["OWNER"].strip().lstrip("@")
          version = os.environ["VERSION"].strip()
          if not owner or not version:
              raise SystemExit("Owner and version are required.")
          if not preview:
              token = os.environ["CLAWHUB_TOKEN"]
              if not token:
                  raise SystemExit("Configure the CLAWHUB_TOKEN repository secret before publishing.")
              config = Path(os.environ["CLAWHUB_CONFIG_PATH"])
              config.touch(mode=0o600)
              config.write_text(json.dumps({"registry": "https://clawhub.ai", "token": token}))

          cli = ["npx", "--yes", "clawhub@0.23.3"]
          args = [
              "skill", "publish", "providers/portable/skills/pandadoc",
              "--slug", "pandadoc", "--name", "PandaDoc", "--owner", owner,
              "--version", version, "--categories", "integrations",
              "--topics", "documents,e-signature,pandadoc", "--json",
              "--source-repo", os.environ["GITHUB_REPOSITORY"],
              "--source-commit", os.environ["GITHUB_SHA"],
              "--source-path", "providers/portable/skills/pandadoc",
          ]
          if preview:
              args.append("--dry-run")
          try:
              subprocess.run(cli + args, check=True)
              if not preview:
                  subprocess.run(cli + ["inspect", f"@{owner}/pandadoc", "--version", version, "--json"], check=True)
          finally:
              Path(os.environ["CLAWHUB_CONFIG_PATH"]).unlink(missing_ok=True)
          PY
