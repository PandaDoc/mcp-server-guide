name: Sync skills

# Imports skills from pandadoc-studio/agentic-hub-skills into this Claude plugin. When the content
# hash of any skill changes, it bumps the plugin version and commits the updated files to main.
# It does NOT create tags or GitHub Releases (this repo has its own release system). No change → no-op.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source ref (tag/branch). Blank = latest release tag, fallback main."
        required: false
        default: ""
      bump:
        description: "Version bump when changes are found"
        required: false
        default: "patch"
        type: choice
        options: [patch, minor, major]
  # Nightly sync (requires the SKILLS_REPO_TOKEN secret — see PR description).
  schedule:
    - cron: "0 6 * * *" # nightly at 06:00 UTC

permissions:
  contents: write

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — otherwise checkout writes the default workflow token as a
      # git auth header for github.com, which hijacks the clone of the private skills repo.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Read access to the (internal) skills repo, scoped to ONLY that repo so it never
      # interferes with pushing back to this repo.
      - name: Configure skills-repo read access
        env:
          SKILLS_REPO_TOKEN: ${{ secrets.SKILLS_REPO_TOKEN }}
        run: |
          if [ -z "${SKILLS_REPO_TOKEN}" ]; then
            echo "::error::SKILLS_REPO_TOKEN secret is not set."
            exit 1
          fi
          git config --global "url.https://x-access-token:${SKILLS_REPO_TOKEN}@github.com/pandadoc-studio/agentic-hub-skills.insteadOf" "https://github.com/pandadoc-studio/agentic-hub-skills"

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*" # latest LTS

      - name: Sync skills
        id: sync
        env:
          SKILLS_REF: ${{ github.event.inputs.ref }}
          BUMP: ${{ github.event.inputs.bump }}
        run: node scripts/sync-skills.mjs

      - name: Validate plugin
        if: steps.sync.outputs.changed == 'true'
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict

      - name: Commit skill updates
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sync.outputs.version }}
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -m "chore(skills): sync agentic-hub-skills → v${VERSION} (${SUMMARY})"
          git push origin HEAD:main
